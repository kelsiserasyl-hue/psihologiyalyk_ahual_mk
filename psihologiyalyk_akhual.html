<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Психологиялық ахуал</title>
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;color:#1b2a41;overflow-x:hidden;
 background:radial-gradient(circle at 15% 10%,#e3f0ff 0,transparent 45%),radial-gradient(circle at 90% 85%,#f1e8ff 0,transparent 45%),linear-gradient(135deg,#f3f9ff,#f6f1ff 55%,#effaf4)}
.orbit{position:fixed;border:2px solid rgba(80,120,220,.12);border-radius:50%;pointer-events:none;animation:spin 60s linear infinite}
.orbit:after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:rgba(80,120,220,.25);top:-7px;left:50%}
.o1{width:560px;height:560px;left:-200px;top:-180px}.o2{width:720px;height:720px;right:-300px;bottom:-320px;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.wrap{position:relative;max-width:1120px;margin:0 auto;padding:26px 18px 48px;text-align:center}
h1{margin:0;font-size:clamp(28px,5vw,54px);letter-spacing:2px;background:linear-gradient(90deg,#1e5bd8,#7a3fd6,#13a58a);-webkit-background-clip:text;background-clip:text;color:transparent}
.tags{margin:6px 0 0;color:#5a6b86;font-weight:700;font-size:clamp(13px,1.7vw,17px);letter-spacing:.5px}
.div{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px auto;max-width:420px;color:#d9a21f}
.div i{flex:1;height:2px;background:linear-gradient(90deg,transparent,#e0aa2e,transparent)}.div svg{width:34px;height:26px}
.lead{margin:0 auto 14px;max-width:760px;font-size:clamp(16px,2vw,21px);line-height:1.5;font-weight:600}
.bar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:center;margin-bottom:22px}
#cnt{font-weight:800;font-size:clamp(16px,2vw,20px);background:#fff;border:2px solid #e0aa2e;border-radius:40px;padding:8px 20px;box-shadow:0 4px 14px rgba(30,60,140,.12)}
.dots{display:flex;gap:7px}.dots b{width:14px;height:14px;border-radius:50%;background:#d3dcef;transition:.4s}.dots b.on{background:#e0aa2e;box-shadow:0 0 10px #e0aa2e;transform:scale(1.2)}
#rst{font:800 17px "Trebuchet MS","Segoe UI",Arial,sans-serif;border:0;border-radius:40px;padding:11px 24px;background:linear-gradient(135deg,#2563d6,#7a3fd6);color:#fff;cursor:pointer;box-shadow:0 6px 16px rgba(60,60,200,.3)}
#rst:hover{filter:brightness(1.1)}button:focus-visible{outline:4px solid #ffb703;outline-offset:3px}
.stage{position:relative}
.grid{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:24px;transition:gap .9s,padding .9s,box-shadow .9s,background .9s;border-radius:28px}
.card{position:relative;height:310px;perspective:1100px;border:0;background:none;padding:0;cursor:pointer;font:inherit;text-align:center;color:inherit}
.card:before,.card:after{content:"";position:absolute;width:28px;height:28px;border-radius:50%;background:hsl(var(--h) 75% 48%);z-index:0;transition:opacity .6s}
.card:after{right:-14px;top:calc(50% - 14px)}.card:before{bottom:-14px;left:calc(50% - 14px)}
.card:nth-child(3n):after,.card:nth-child(n+4):before{display:none}
.in{position:absolute;inset:0;z-index:1;transition:transform .85s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.card:not(.open):hover .in{transform:translateY(-6px) rotateX(4deg)}
.card.open .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 22px;overflow:hidden;box-shadow:0 12px 26px rgba(30,50,110,.2)}
.front{background:linear-gradient(150deg,hsl(var(--h) 85% 60%),hsl(calc(var(--h) + 25) 70% 34%));color:#fff}
.front:before{content:"";position:absolute;inset:8px;border:2px dashed rgba(255,222,120,.8);border-radius:16px}
.front:after{content:"";position:absolute;left:-30%;top:-60%;width:90%;height:100%;background:rgba(255,255,255,.14);transform:rotate(25deg)}
.num{position:absolute;top:16px;left:18px;width:42px;height:42px;border-radius:50%;background:#fff;color:hsl(var(--h) 70% 36%);font-weight:900;font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.25);z-index:2}
.ic{width:84px;height:84px;color:currentColor;stroke:currentColor;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;z-index:2}
.front .ic{filter:drop-shadow(0 4px 6px rgba(0,0,0,.3));animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-5px)}}
.hint{margin-top:12px;font-weight:800;font-size:16px;z-index:2;background:rgba(0,0,0,.18);padding:5px 14px;border-radius:20px}
.back{transform:rotateY(180deg);background:linear-gradient(#fff,hsl(var(--h) 90% 96%));border:3px solid hsl(var(--h) 70% 52%)}
.back .ic{width:46px;height:46px;color:hsl(var(--h) 70% 42%);flex:none}
.back h2{margin:6px 0 6px;font-size:clamp(19px,2.2vw,23px);color:hsl(var(--h) 70% 33%);line-height:1.2}
.back p{margin:0;font-size:clamp(15px,1.7vw,17px);line-height:1.45;font-weight:600}
.o{position:absolute;width:30px;height:22px;color:#e0aa2e;z-index:2}.o1c{top:5px;right:8px;transform:rotate(45deg)}.o2c{top:5px;left:8px;transform:rotate(-45deg)}
.o3c{bottom:5px;right:8px;transform:rotate(135deg)}.o4c{bottom:5px;left:8px;transform:rotate(-135deg)}
.card.open .in{animation:pop .9s}@keyframes pop{40%{filter:brightness(1.15)}}
.grid.solved{gap:4px;padding:10px;background:linear-gradient(135deg,#e0aa2e,#fff1b0,#e0aa2e);box-shadow:0 0 50px rgba(224,170,46,.65)}
.solved .card:before,.solved .card:after{opacity:0}.solved .face{border-radius:8px}
.solved .card{animation:glow 1.6s ease-in-out 2}@keyframes glow{50%{filter:brightness(1.18)}}
.wave{position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px;border:4px solid #e0aa2e;border-radius:50%;opacity:0;pointer-events:none}
.stage.done .wave{animation:wv 2.6s ease-out forwards}.stage.done .wave:nth-of-type(2){animation-delay:.5s}.stage.done .wave:nth-of-type(3){animation-delay:1s}
@keyframes wv{from{transform:scale(.2);opacity:.9}to{transform:scale(4);opacity:0}}
.sp{position:absolute;left:50%;top:50%;width:10px;height:10px;border-radius:50%;background:radial-gradient(#fff,#ffcf4a);pointer-events:none;z-index:5}
.fin{margin:26px auto 0;max-width:820px;padding:22px 26px;border-radius:24px;background:#fff;border:4px solid #e0aa2e;box-shadow:0 0 0 8px #fff7d6,0 18px 40px rgba(30,60,140,.25);animation:rise .9s cubic-bezier(.2,.8,.3,1)}
@keyframes rise{from{opacity:0;transform:translateY(30px) scale(.94)}}
.chip{display:inline-block;background:linear-gradient(135deg,#13a58a,#2563d6);color:#fff;font-weight:800;border-radius:30px;padding:6px 20px;font-size:clamp(14px,1.8vw,18px);margin-bottom:12px}
.fin p{margin:0;font-size:clamp(21px,3.2vw,33px);line-height:1.35;font-weight:800;color:#173a7a}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.card:nth-child(3n):after{display:block}.card:nth-child(2n):after{display:none}.card:nth-child(n+4):before{display:block}.card:nth-child(n+5):before{display:none}}
@media(max-width:560px){.grid{grid-template-columns:1fr;gap:26px}.card:after{display:none!important}.card:nth-child(-n+5):before{display:block!important}.card:nth-child(6):before{display:none!important}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="horn" viewBox="-14 0 28 20"><path d="M0 0c10-1 17 7 12 14-4 6-13 4-13-3 0-5 6-6 8-2M0 0c-10-1-17 7-12 14 4 6 13 4 13-3 0-5-6-6-8-2M0 2v10" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
<symbol id="atom" viewBox="0 0 48 48"><circle cx="24" cy="24" r="3.5" fill="currentColor"/><ellipse cx="24" cy="24" rx="20" ry="8"/><ellipse cx="24" cy="24" rx="20" ry="8" transform="rotate(60 24 24)"/><ellipse cx="24" cy="24" rx="20" ry="8" transform="rotate(120 24 24)"/></symbol>
<symbol id="mol" viewBox="0 0 48 48"><circle cx="12" cy="30" r="6"/><circle cx="34" cy="14" r="7"/><circle cx="36" cy="36" r="5"/><path d="M17 26L29 18M17 33L31 35"/></symbol>
<symbol id="nn" viewBox="0 0 48 48"><circle cx="9" cy="12" r="4"/><circle cx="9" cy="24" r="4"/><circle cx="9" cy="36" r="4"/><circle cx="24" cy="18" r="4"/><circle cx="24" cy="30" r="4"/><circle cx="39" cy="24" r="4"/><path d="M13 12L20 18M13 24L20 18M13 24L20 30M13 36L20 30M13 12L20 30M13 36L20 18M28 18L35 24M28 30L35 24"/></symbol>
<symbol id="ray" viewBox="0 0 48 48"><path d="M24 8L40 36H8Z"/><path d="M2 22L16 26M32 28L46 22M32 32L46 32M32 36L46 42"/></symbol>
<symbol id="frm" viewBox="0 0 48 48"><rect x="3" y="9" width="42" height="30" rx="7"/><text x="24" y="29" text-anchor="middle" font-size="13" font-weight="800" fill="currentColor" stroke="none" font-family="Segoe UI,Arial,sans-serif">E=mc²</text></symbol>
<symbol id="bulb" viewBox="0 0 48 48"><path d="M24 5a13 13 0 0 0-7 24v5h14v-5a13 13 0 0 0-7-24z"/><path d="M18 40h12M20 44h8"/></symbol>
<symbol id="sprout" viewBox="0 0 48 48"><path d="M24 43V22M24 29C24 19 14 15 8 17c0 8 6 13 16 12M24 25c0-9 8-14 16-12 0 8-6 13-16 12"/></symbol>
<symbol id="chat" viewBox="0 0 48 48"><path d="M7 9h34v24H23l-9 8v-8H7z"/><circle cx="16" cy="21" r="1.8" fill="currentColor"/><circle cx="24" cy="21" r="1.8" fill="currentColor"/><circle cx="32" cy="21" r="1.8" fill="currentColor"/></symbol>
<symbol id="rings" viewBox="0 0 48 48"><circle cx="17" cy="24" r="11"/><circle cx="31" cy="24" r="11"/></symbol>
<symbol id="heart" viewBox="0 0 48 48"><path d="M24 41C8 29 5 17 13 11c5-3 9 0 11 4 2-4 6-7 11-4 8 6 5 18-11 30z"/></symbol>
<symbol id="lens" viewBox="0 0 48 48"><circle cx="21" cy="21" r="12"/><path d="M30 30L42 42"/></symbol>
<symbol id="star" viewBox="0 0 48 48"><path d="M24 5l5.5 11.5 12.5 1.7-9.2 8.7 2.4 12.4L24 33.2 12.8 39.3l2.4-12.4L6 18.2l12.5-1.7z"/></symbol>
</defs></svg>
<div class="orbit o1"></div><div class="orbit o2"></div>
<main class="wrap">
  <h1>ПСИХОЛОГИЯЛЫҚ АХУАЛ</h1>
  <p class="tags">Физика · Жасанды интеллект · Функционалдық сауаттылық</p>
  <div class="div"><i></i><svg viewBox="-14 0 28 20"><use href="#horn"/></svg><i></i></div>
  <p class="lead">Әр ұяшықты басып, қолдау сөздерін ашыңыз. Барлық 6 ұяшық ашылғанда, ортақ ізгі тілек толық құрастырылады!</p>
  <div class="bar"><div id="cnt" aria-live="polite">Ашылған ұяшықтар: 0/6</div><div class="dots" id="dots"></div><button id="rst" type="button">Қайта бастау</button></div>
  <div class="stage" id="stage"><i class="wave"></i><i class="wave"></i><i class="wave"></i><div class="grid" id="grid" role="group" aria-label="Алты ұяшық"></div></div>
  <section class="fin" id="fin" hidden aria-live="polite"></section>
</main>
<script>
const D=[
{t:'Қателесуден қорықпа!',x:'Қателесу — үйренудің бір бөлігі. ЖИ де, біз де тәжірибе арқылы жетілеміз. Ең бастысы — қатені бірге талдап, дұрыс шешім табу!',h:215,f:'atom',b:'sprout'},
{t:'Еркін ойла!',x:'Бұл жерде әр пікір құнды. Ойыңды еркін білдір, болжамыңды ұсын, бірге талқылап, ортақ шешімге кел!',h:268,f:'bulb',b:'chat'},
{t:'Бірлесіп әрекет ет!',x:'Әр қатысушының өз рөлі мен үлесі бар. Бірлесе жұмыс істеу жаңа идеяларға жол ашады!',h:180,f:'nn',b:'rings'},
{t:'Бір-біріңе көмектес!',x:'Тәжірибеңмен бөліс, әріптесіңе қолдау көрсет. Бірге зерттеу арқылы күрделі тапсырмаларды да жеңілдетуге болады!',h:148,f:'mol',b:'heart'},
{t:'Сындарлы пікір білдір!',x:'Алдымен байқағаныңды айт, содан кейін ұсынысыңды білдір. Әр пікір жаңа шешім табуға көмектеседі!',h:245,f:'ray',b:'lens'},
{t:'Жетістікті бірге атап өт!',x:'Әрбір дұрыс қадам — ортақ жетістік. Ізденісіміз нәтижелі болып, жаңа мүмкіндіктерге жол ашылсын!',h:38,f:'frm',b:'star'}];
const WISH='Біліміміз тәжірибемен толығып, тәжірибеміз жаңа мүмкіндіктерге жол ашсын!';
const $=id=>document.getElementById(id),grid=$('grid'),stage=$('stage'),fin=$('fin');
const ic=id=>`<svg class="ic" viewBox="0 0 48 48"><use href="#${id}"/></svg>`;
const orn=['o1c','o2c','o3c','o4c'].map(c=>`<svg class="o ${c}" viewBox="-14 0 28 20"><use href="#horn"/></svg>`).join('');
D.forEach((d,i)=>{const b=document.createElement('button');b.type='button';b.className='card';b.style.setProperty('--h',d.h);
 b.setAttribute('aria-label','Ұяшық '+(i+1)+'. Ашу үшін басыңыз');
 b.innerHTML=`<span class="in"><span class="face front"><span class="num">${i+1}</span>${orn}${ic(d.f)}<span class="hint">Ашу үшін басыңыз</span></span><span class="face back">${orn}${ic(d.b)}<h2>${d.t}</h2><p>${d.x}</p></span></span>`;
 b.onclick=()=>openCard(b,i);grid.appendChild(b)});
const dots=$('dots');for(let i=0;i<6;i++)dots.appendChild(document.createElement('b'));
let opened=0,timer=0;
function openCard(b,i){if(b.classList.contains('open'))return;b.classList.add('open');b.setAttribute('aria-label',D[i].t+' '+D[i].x);opened++;update();
 if(opened===6)timer=setTimeout(finish,1100)}
function update(){$('cnt').textContent='Ашылған ұяшықтар: '+opened+'/6';[...dots.children].forEach((d,k)=>d.classList.toggle('on',k<opened))}
function finish(){grid.classList.add('solved');stage.classList.add('done');burst();
 fin.innerHTML='<div class="chip">Барлық ұяшық ашылды!</div><p></p>';fin.querySelector('p').textContent=WISH;fin.hidden=false;
 setTimeout(()=>fin.scrollIntoView({behavior:'smooth',block:'nearest'}),400)}
function burst(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 for(let i=0;i<40;i++){const p=document.createElement('i');p.className='sp';stage.appendChild(p);const a=Math.random()*6.283,d=140+Math.random()*260;
  p.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(.2)`,opacity:0}],{duration:1100+Math.random()*900,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>p.remove()}}
$('rst').onclick=()=>{clearTimeout(timer);opened=0;update();grid.classList.remove('solved');stage.classList.remove('done');fin.hidden=true;fin.innerHTML='';
 stage.querySelectorAll('.sp').forEach(p=>p.remove());
 [...grid.children].forEach((b,i)=>{b.classList.remove('open');b.setAttribute('aria-label','Ұяшық '+(i+1)+'. Ашу үшін басыңыз')})};
grid.addEventListener('keydown',e=>{const k={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1}[e.key];if(!k)return;
 const c=[...grid.children],i=c.indexOf(document.activeElement);if(i<0)return;e.preventDefault();c[(i+k+6)%6].focus()});
</script>
</body>
</html>
